plugins {
    id 'com.android.application'
}

android {
    namespace 'com.projet207.dashboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.projet207.dashboard"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        noCompress 'html'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
